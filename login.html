<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жүйеге кіру — Онлайн Кітапхана</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html#catalog" class="brand-logo">📚 Онлайн Кітапхана</a>
        <nav class="main-nav">
            <a href="index.html#catalog" class="nav-link">Басты бет</a>
            <a href="books.html" class="nav-link">Кітаптар қоры</a>
            <a href="login.html" class="nav-link active">Кіру</a>
            <a href="register.html" class="nav-link">Тіркелу</a>
        </nav>
    </div>
</header>
<main class="container">
    <div class="form-glass-card">
        <span class="section-kicker">Жеке кабинет</span>
        <h1 class="section-heading" style="margin-bottom:20px;">Жүйеге кіру</h1>
        <form action="index.html#catalog">
            <div class="form-group">
                <label>Электронды пошта</label>
                <input type="email" class="glass-input" placeholder="example@mail.kz" required>
            </div>
            <div class="form-group">
                <label>Құпиясөз</label>
                <input type="password" class="glass-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary-glow" style="width:100%; justify-content:center;">Кіру</button>
        </form>
    </div>
</main>
<footer class="site-footer"><div class="container"><p>© 2026 Онлайн Кітапхана.</p></div></footer>
</body>
</html>
